 {q:"사진 찍힐 때 나는?",o:[["카메라 정면으로 봄",{W:.1,D:.2,S:.8}],["살짝 딴 데 봄",{S:-.3,T:.2}],["찍히는 거 피함",{D:.4,S:-.8,T:-.5}]]},
 {q:"“어울린다”보다 듣고 싶은 말은?",o:[["분위기 있다",{W:-.5,D:.8,S:-.2,T:-.2}],["화사하다",{W:.6,D:-.9,S:.4,T:.5}],["세 보인다",{W:-.2,D:.5,S:.9,T:-.3}],["편안해 보인다",{W:.4,D:-.3,S:-.7,T:.1}]]}];

const RMIN={W:-2.7,D:-3.6,S:-4.0,T:-3.8}, RMAX={W:3.2,D:4.4,S:4.7,T:4.1};
const AMIN={W:-1,D:0,S:0,T:0}, AMAX={W:1,D:.94,S:.96,T:1};
const WGT={W:1,D:1.2,S:1,T:.5};
const AX=["W","D","S","T"];
const PHRASE={W:["따뜻하게","서늘하게"],D:["깊게","환하게"],S:["또렷하게","은은하게"],T:["부드럽게","담백하게"]};
const AXLABEL={W:"Warm",D:"Deep",S:"Vivid",T:"Gloss"};

function scoreOf(ans){
  const r={W:0,D:0,S:0,T:0};
  ans.forEach((oi,qi)=>{const w=Q[qi].o[oi][1];for(const k in w)r[k]+=w[k];});
  const p={};
  AX.forEach(a=>{const t=(r[a]-RMIN[a])/(RMAX[a]-RMIN[a]);p[a]=AMIN[a]+t*(AMAX[a]-AMIN[a]);});
  return p;
}
function nearest(p,useBias){
  let best=null,bv=Infinity;
  for(const a of ARCH){
    let d=0;AX.forEach(k=>{d+=WGT[k]*Math.pow(p[k]-a[k],2)});
    if(useBias)d-=BIAS[a.s];
    if(d<bv){bv=d;best=a}
  }
  return best;
}
const bySlug=s=>ARCH.find(a=>a.s===s);

function lab(hex){
  const x=hex.replace("#","");
  let r=parseInt(x.substr(0,2),16)/255,g=parseInt(x.substr(2,2),16)/255,b=parseInt(x.substr(4,2),16)/255;
  const li=c=>c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4);
  r=li(r);g=li(g);b=li(b);
  const X=(.4124564*r+.3575761*g+.1804375*b)/.95047,
        Y=(.2126729*r+.7151522*g+.0721750*b),
        Z=(.0193339*r+.1191920*g+.9503041*b)/1.08883;
  const f=t=>t>216/24389?Math.cbrt(t):(841/108)*t+4/29;
  const fx=f(X),fy=f(Y),fz=f(Z);
  return[116*fy-16,500*(fx-fy),200*(fy-fz)];
}
function deltaE(h1,h2){
  const A=lab(h1),B=lab(h2);
  const L1=A[0],a1=A[1],b1=A[2],L2=B[0],a2=B[1],b2=B[2];
  const C1=Math.hypot(a1,b1),C2=Math.hypot(a2,b2),Cb=(C1+C2)/2;
  const cb7=Math.pow(Cb,7),p25=Math.pow(25,7);
  const G=.5*(1-Math.sqrt(cb7/(cb7+p25)||0));
  const a1p=(1+G)*a1,a2p=(1+G)*a2;
  const C1p=Math.hypot(a1p,b1),C2p=Math.hypot(a2p,b2);
  const rad=d=>d*Math.PI/180;
  const h1p=(Math.atan2(b1,a1p)*180/Math.PI+360)%360,h2p=(Math.atan2(b2,a2p)*180/Math.PI+360)%360;
  const dLp=L2-L1,dCp=C2p-C1p;
  let dhp=0;
  if(C1p*C2p!==0){dhp=h2p-h1p;if(dhp>180)dhp-=360;else if(dhp<-180)dhp+=360;}
  const dHp=2*Math.sqrt(C1p*C2p)*Math.sin(rad(dhp)/2);
  const Lbp=(L1+L2)/2,Cbp=(C1p+C2p)/2;
  let hbp;
  if(C1p*C2p===0)hbp=h1p+h2p;
  else if(Math.abs(h1p-h2p)<=180)hbp=(h1p+h2p)/2;
  else hbp=(h1p+h2p<360)?(h1p+h2p+360)/2:(h1p+h2p-360)/2;
  const T=1-.17*Math.cos(rad(hbp-30))+.24*Math.cos(rad(2*hbp))+.32*Math.cos(rad(3*hbp+6))-.20*Math.cos(rad(4*hbp-63));
  const dth=30*Math.exp(-Math.pow((hbp-275)/25,2));
  const cbp7=Math.pow(Cbp,7);
  const Rc=2*Math.sqrt(cbp7/(cbp7+p25)||0);
  const Sl=1+(.015*Math.pow(Lbp-50,2))/Math.sqrt(20+Math.pow(Lbp-50,2));
  const Sc=1+.045*Cbp,Sh=1+.015*Cbp*T,Rt=-Math.sin(rad(2*dth))*Rc;
  return Math.sqrt(Math.pow(dLp/Sl,2)+Math.pow(dCp/Sc,2)+Math.pow(dHp/Sh,2)+Rt*(dCp/Sc)*(dHp/Sh));
}
function judge(mine,theirs){
  if(mine.s===theirs.s)return{t:"match",x:"나를 정확히 알고 있는 친구"};
  if(deltaE(mine.h,theirs.h)<18)return{t:"near",x:"반 발짝 옆에서 나를 보는 친구"};
  let ax="W",mx=0;
  AX.forEach(k=>{const d=theirs[k]-mine[k];if(Math.abs(d)>Math.abs(mx)){mx=d;ax=k}});
  return{t:"diff",x:"생각보다 나를 더 "+PHRASE[ax][mx>0?0:1]+" 보는 친구"};
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean=s=>String(s).replace(/[^가-힣ㄱ-ㅎa-zA-Z0-9]/g,"").slice(0,8);
function rid(){const a=new Uint8Array(16);crypto.getRandomValues(a);
  return Array.from(a).map(b=>b.toString(36).padStart(2,"0")).join("").slice(0,22);}
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
          set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function getAns(){try{return JSON.parse(LS.get("answers")||"[]")}catch(e){return[]}}
function addAns(i,nk){
  const a=getAns().filter(x=>x.nk!==nk);
  a.push({i:i,nk:nk});
  LS.set("answers",JSON.stringify(a));
  return a;
}
function baseUrl(){return location.origin+location.pathname+location.search}
function clearHash(){try{history.replaceState(null,"",baseUrl())}catch(e){}}
const IDXC="0123456789ab";
function enc(s){try{
  const b=new TextEncoder().encode(s);let t="";
  for(let i=0;i<b.length;i++)t+=String.fromCharCode(b[i]);
  return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}catch(e){return""}}
function dec(b){try{
  const t=b.replace(/-/g,"+").replace(/_/g,"/");
  const s=atob(t),a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);
  return new TextDecoder().decode(a);
}catch(e){return""}}

const VB={good:["b-ok","진짜 할인"],bad:["b-bad","부풀려진 정상가"],warn:["b-hold","지금은 대기"]};
function prodHTML(slug){
  const rows=(typeof PROD!=="undefined"&&PROD[slug])||[];
  if(!rows.length)return '<p class="note">이 색의 제품 매칭을 준비 중이에요.</p>';
  return '<div class="plist">'+rows.map(function(r){
    const v=VB[r.v]||["b-hold","판정 보류"];
    const price=r.c?Number(r.c).toLocaleString("ko-KR")+"원":"가격 확인";
    return '<a class="pcard" href="'+esc(r.u)+'" target="_blank" rel="noopener">'+
      (r.i?'<img class="th" src="'+esc(r.i)+'" alt="" loading="lazy" style="background:'+esc(r.h)+'" onerror="this.removeAttribute(\'src\')">':'<span class="th" style="background:'+esc(r.h)+'"></span>')+
      '<span class="bd"><span class="bn">'+esc(r.b)+'</span>'+
      '<span class="on"><span class="swatch" style="background:'+esc(r.h)+'"></span>'+esc(r.o)+'</span>'+
      '<span class="pr">'+price+' <span class="badge '+v[0]+'">'+v[1]+'</span></span>'+
      '<span class="vt">'+esc(r.t||"")+'</span></span></a>';
  }).join("")+'</div>';
}
function axesHTML(a){
  return '<div class="axes">'+AX.map(k=>{
    const v=k==="W"?(a[k]+1)/2:a[k];
    return '<div class="ax"><span>'+AXLABEL[k]+'</span><span class="track"><i style="width:'+
      Math.round(v*100)+'%"></i></span><span class="val">'+Math.round(v*100)+'</span></div>';
  }).join("")+'</div>';
}
function stripHTML(){return '<div class="strip">'+ARCH.map(a=>'<span style="background:'+a.h+'"></span>').join("")+'</div>';}
function gridHTML(){

function viewQ(i,ans){
  const q=Q[i];
  show('<p class="eyebrow">질문 '+(i+1)+' / '+Q.length+'</p>'+
  '<div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div>'+
  '<h2>'+esc(q.q)+'</h2>'+
  '<div class="stack">'+q.o.map((o,k)=>'<button class="opt" data-k="'+k+'">'+esc(o[0])+'</button>').join("")+'</div>'+
  (i>0?'<button class="link" id="back">이전 질문</button>':""));
  app().querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const na=ans.slice(0,i);na.push(+b.dataset.k);
    if(i+1<Q.length)viewQ(i+1,na);else finish(na);
  });
  const bk=document.getElementById("back");if(bk)bk.onclick=()=>viewQ(i-1,ans);
}

function finish(ans){
  const a=nearest(scoreOf(ans),true);
  LS.set("slug",a.s);
  const p=LS.get("pending");
  if(p){LS.set("pending","");location.hash="#g="+p;return}
  viewResult(a);
}

  '<div class="stack"><button class="cta" id="mine">내 팔레트 보기 ('+getAns().length+')</button>'+
  '<button class="ghost" id="more">다른 친구에게도 물어보기</button></div>');
  document.getElementById("mine").onclick=()=>{location.hash="#me"};
  document.getElementById("more").onclick=()=>{clearHash();viewAskLink()};
}

function viewMe(){
  const ms=LS.get("slug");
  if(!ms||!bySlug(ms)){
    show('<h2>먼저 테스트를 해주세요</h2><button class="cta" id="go">내 입술의 이름 찾기</button>');
    document.getElementById("go").onclick=()=>{clearHash();viewQ(0,[])};return}
  const mine=bySlug(ms);
  const rows=getAns().map(x=>({a:ARCH[x.i],nk:x.nk})).filter(x=>x.a);

  let avg="";
  if(rows.length>=3){
    const p={W:0,D:0,S:0,T:0};
    rows.forEach(r=>{AX.forEach(x=>p[x]+=r.a[x])});
    AX.forEach(x=>p[x]/=rows.length);
    const seen=nearest(p,false);
    const same=seen.s===mine.s;
    let tail="";
    if(!same){let ax="W",mx=0;AX.forEach(x=>{const d=seen[x]-mine[x];if(Math.abs(d)>Math.abs(mx)){mx=d;ax=x}});
      tail="사람들은 나를 더 "+PHRASE[ax][mx>0?0:1]+" 봐요.";}
    avg='<hr class="sep"><p class="eyebrow">남들이 보는 나</p>'+
    '<div class="pair"><div class="col"><span class="pill">내가 아는 나</span>'+
    '<span class="blk" style="background:'+mine.h+'"></span><span class="name-s">'+esc(mine.n)+'</span></div>'+
    '<div class="col"><span class="pill">남들이 보는 나</span>'+
    '<span class="blk" style="background:'+seen.h+'"></span><span class="name-s">'+esc(seen.n)+'</span></div></div>'+
    '<p class="copy" style="font-size:17px">'+(same?"보이는 나와 아는 나가 같은 사람이에요.":esc(tail))+'</p>';
  }

  show('<p class="eyebrow">친구들이 고른 내 색</p>'+
  '<h2>'+rows.length+'명이 답했어요</h2>'+
  (rows.length?'<div class="miniwrap">'+rows.map(r=>
    '<span class="mini" style="background:'+r.a.h+'" title="'+esc(r.a.n)+'"></span>').join("")+'</div>'
   :'<p class="lede">아직 받은 색이 없어요. 물어보기 링크를 친구에게 보내보세요.</p>')+
  rows.map(r=>{const j=judge(mine,r.a);
    return '<div class="card"><div class="rowline"><span class="dot" style="background:'+r.a.h+'"></span>'+
    '<span><span class="name-s">'+esc(r.a.n)+'</span>'+
    '<span class="note" style="display:block">'+esc(r.nk)+'님이 고른 색</span></span></div>'+
    '<p style="margin:0;font-size:15px;color:var(--ink-2)">'+esc(j.x)+'</p></div>'}).join("")+
  (rows.length>0&&rows.length<3?'<p class="note">세 명 이상 모이면 “남들이 보는 내 색”이 열려요.</p>':"")+
  avg+
  '<hr class="sep"><div class="stack"><button class="ghost" id="again">물어보기 링크 다시 보기</button>'+
  '<button class="link" id="home">내 결과로</button></div>');
  document.getElementById("again").onclick=()=>{clearHash();viewAskLink()};
  document.getElementById("home").onclick=()=>{clearHash();viewResult(mine)};
}

function route(){
  const h=location.hash;
  if(h.indexOf("#a=")===0)return viewAsk(dec(h.slice(3)));
  if(h.indexOf("#g=")===0){const p=h.slice(3);return viewGot(IDXC.indexOf(p.charAt(0)),dec(p.slice(1)))}
  if(h.indexOf("#ask=")===0)return viewAsk(decodeURIComponent(h.slice(5)));
  if(h.indexOf("#got=")===0){const p=h.slice(5),d=p.indexOf(".");
    return viewGot(parseInt(p.slice(0,d<0?p.length:d),10),decodeURIComponent(d<0?"":p.slice(d+1)))}
  if(h==="#me")return viewMe();
  const s=LS.get("slug");
  if(s&&bySlug(s))return viewResult(bySlug(s));
  viewIntro();
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
