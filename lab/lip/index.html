<style>
:root{
  --ground:#F7F4F1; --panel:#FFFEFD; --ink:#1B1614; --ink-2:#544A45;
  --muted:#8C817B; --line:#E5DDD6; --line-2:#D3C8C0;
  --accent:#8C3A50; --accent-ink:#FFFFFF;
  --ok:#2F6B4F; --ok-bg:#E8F0EB; --bad:#A6392C; --bad-bg:#F9E9E6;
  --hold:#7A7370; --hold-bg:#EFEBE7;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --serif:"Gowun Batang",Georgia,"Apple SD Gothic Neo",serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.7;margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
.wrap{max-width:440px;margin:0 auto;padding:22px 20px 72px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
#app{display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--serif);font-weight:700;font-size:33px;line-height:1.34;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.38;margin:0;text-wrap:balance}
.lede{font-size:15px;color:var(--ink-2);margin:0}
.eyebrow{font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0}
button{font-family:inherit;font-size:15px;font-weight:400;cursor:pointer;border-radius:11px;transition:background .15s,border-color .15s,color .15s}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cta{background:var(--accent);color:var(--accent-ink);border:none;padding:16px 20px;width:100%;font-size:15.5px;font-weight:400}
.cta:hover{filter:brightness(.92)}
.cta[disabled]{opacity:.55;cursor:default}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2);padding:15px 20px;width:100%}
.ghost:hover{background:var(--panel);border-color:var(--muted)}
.link{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:6px 0;cursor:pointer;width:auto;align-self:flex-start}
.stack{display:flex;flex-direction:column;gap:10px}
.strip{display:grid;grid-template-columns:repeat(12,1fr);height:56px;border-radius:9px;overflow:hidden}
.bar{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .35s}

.qgrid{display:grid;gap:11px}
.q2{grid-template-columns:1fr 1fr}
.q3{grid-template-columns:1fr}
.q4{grid-template-columns:1fr 1fr}
.qc{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:20px 16px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px;color:var(--ink);min-height:118px;justify-content:center}
.qc:hover{border-color:var(--accent);background:#fff}
.qc .em{font-size:30px;line-height:1}
.qc .lb{font-size:14.5px;line-height:1.4}
.qc.row{flex-direction:row;justify-content:flex-start;text-align:left;min-height:0;padding:15px 17px;gap:13px}
.qc.row .em{font-size:22px}
.qc .word{font-family:var(--mono);font-weight:500;font-size:19px;letter-spacing:.16em}
.qc .swm{width:100%;height:46px;border-radius:8px}

.pant{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#fff}
.pant .fill{height:252px}
.pant .band{background:#fff;color:#1B1614;padding:15px 17px 17px}
.pant .bt{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-weight:500;
  font-size:9.5px;letter-spacing:.2em;color:#8C817B;text-transform:uppercase}
.pant .bn{font-family:var(--serif);font-weight:700;font-size:27px;line-height:1.26;margin:10px 0 7px;text-wrap:balance}
.pant .bh{font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.12em}
.pant .bs{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:#8C817B;margin-top:4px}
.spk{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;color:var(--accent)}
.spk svg{width:76px;height:22px;display:block;overflow:visible}
.spkl{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.copy{font-family:var(--serif);font-size:19px;line-height:1.9;margin:0}
.axes{display:flex;flex-direction:column;gap:11px}
.ax{display:grid;grid-template-columns:56px 1fr 30px;align-items:center;gap:12px;font-size:12.5px;color:var(--ink-2)}
.ax .track{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.ax .track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.ax .val{text-align:right;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 17px;display:flex;flex-direction:column;gap:9px}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0}
.sep{height:1px;background:var(--line);border:none;margin:2px 0}
.badge{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-hold{background:var(--hold-bg);color:var(--hold)}
.plist{display:flex;flex-direction:column;gap:9px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.prow{display:flex;gap:12px;align-items:flex-start}
.pcard .th{width:50px;height:50px;border-radius:9px;flex:none;object-fit:cover;border:1px solid rgba(0,0,0,.06)}
.pcard .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pcard .bn{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em}
.pcard .on{font-size:14.5px;line-height:1.35}
.pcard .pr{font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:1px}
.why{background:none;border:none;color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;align-self:flex-start}
.usual{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);letter-spacing:.03em;margin-top:2px}
.cav{margin-top:7px;padding:8px 10px;background:var(--hold-bg);border-radius:8px;color:var(--hold);font-size:12px;line-height:1.6}
.whybox{font-size:12.5px;color:var(--ink-2);line-height:1.65;border-top:1px solid var(--line);padding-top:9px}
.oy{font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

input[type=text]{font-family:inherit;font-size:15px;padding:14px 15px;border:1px solid var(--line-2);border-radius:11px;background:var(--panel);color:var(--ink);width:100%}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.err{color:var(--bad);font-size:13px;margin:0}
.share{font-family:var(--mono);font-size:11.5px;word-break:break-all;background:var(--panel);border:1px dashed var(--line-2);border-radius:10px;padding:12px 13px;color:var(--ink-2);line-height:1.65}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.sw{border:none;background:none;padding:0;cursor:pointer;text-align:left;border-radius:10px}
.sw .chip{display:block;height:72px;border-radius:10px;border:1px solid rgba(0,0,0,.07)}
.sw .nm{display:block;font-size:12px;margin-top:7px;line-height:1.35}
.sw[aria-pressed="true"] .chip{outline:2.5px solid var(--ink);outline-offset:2.5px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair .col{display:flex;flex-direction:column;gap:7px}
.pair .blk{height:96px;border-radius:11px;border:1px solid rgba(0,0,0,.07)}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.name-s{font-family:var(--serif);font-size:15.5px;font-weight:700;line-height:1.35}
.ourfield{height:150px;border-radius:14px;display:flex;align-items:flex-end;padding:16px;color:#fff}
.ourfield.dk{color:#1B1614}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  else hbp=(h1p+h2p<360)?(h1p+h2p+360)/2:(h1p+h2p-360)/2;
  const T=1-.17*Math.cos(rad(hbp-30))+.24*Math.cos(rad(2*hbp))+.32*Math.cos(rad(3*hbp+6))-.20*Math.cos(rad(4*hbp-63));
  const dth=30*Math.exp(-Math.pow((hbp-275)/25,2));
  const cbp7=Math.pow(Cbp,7),Rc=2*Math.sqrt(cbp7/(cbp7+p25)||0);
  const Sl=1+(.015*Math.pow(Lbp-50,2))/Math.sqrt(20+Math.pow(Lbp-50,2));
  const Sc=1+.045*Cbp,Sh=1+.015*Cbp*T,Rt=-Math.sin(rad(2*dth))*Rc;
  return Math.sqrt(Math.pow(dLp/Sl,2)+Math.pow(dCp/Sc,2)+Math.pow(dHp/Sh,2)+Rt*(dCp/Sc)*(dHp/Sh));
}
function judge(mine,theirs){
  if(mine.s===theirs.s)return"나를 정확히 알고 있는 친구";
  if(deltaE(mine.h,theirs.h)<18)return"반 발짝 옆에서 나를 보는 친구";
  let ax="W",mx=0;
  AX.forEach(k=>{const d=theirs[k]-mine[k];if(Math.abs(d)>Math.abs(mx)){mx=d;ax=k}});
  return"생각보다 나를 더 "+PHRASE[ax][mx>0?0:1]+" 보는 친구";
}
/* 두 색을 Lab 공간에서 섞어 '우리의 색'을 만든다 */
/* Lab 색상각 실측 기준 — HSL 아님 */
const HUE=[[320,340,"Berry"],[340,353,"Fuchsia"],[353,360,"Rose"],[0,2,"Rose"],
           [2,14,"Pink"],[14,24,"Mauve"],[24,34,"Cherry"],[34,44,"Coral"],
           [44,54,"Peach"],[54,80,"Cocoa"]];
const MOD=[[70,"Pale"],[58,"Soft"],[46,""],[34,"Deep"],[0,"Dark"]];
const MAT=[[.75,"Glow"],[.50,"Silk"],[.20,"Satin"],[0,"Velvet"]];
function hueName(hd,C){
  if(C<15)return"Nude";
  for(const x of HUE){if(x[0]<=hd&&hd<x[1])return x[2]}
  return"Rose";
}
function ourColor(a,b){
  const A=lab(a.h),B=lab(b.h);
  const L=(A[0]+B[0])/2,aa=(A[1]+B[1])/2,bb=(A[2]+B[2])/2;
  const h=lab2hex(L,aa,bb);
  const hd=(Math.atan2(bb,aa)*180/Math.PI+360)%360, C=Math.hypot(aa,bb);
  let hue=hueName(hd,C);
  if(C>=15&&C<24)hue="Dusty "+hue;
  const mod=(MOD.find(x=>L>=x[0])||MOD[MOD.length-1])[1];
  const t=(a.T+b.T)/2;
  const mat=(MAT.find(x=>t>=x[0])||MAT[MAT.length-1])[1];
  const de=deltaE(a.h,b.h);
  const rel=de<18?"닮은 두 사람이에요. 같은 걸 보고 비슷한 데서 웃는 편."
    :de<32?"조금 다른데 이상하게 잘 맞는 조합이에요."
    :"완전히 다른데 이상하게 오래 보게 되는 조합이에요.";
  return{hex:h,name:[mod,hue,mat].filter(Boolean).join(" "),rel:rel,de:Math.round(de)};
}
function serial(a,ans){
  let s=7;(ans||[]).forEach((v,i)=>s=(s*31+v*13+i)%997);

}

function enc(s){try{const b=new TextEncoder().encode(s);let t="";
  for(let i=0;i<b.length;i++)t+=String.fromCharCode(b[i]);
  return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}catch(e){return""}}
function dec(b){try{const t=b.replace(/-/g,"+").replace(/_/g,"/");
  const s=atob(t),a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);
  return new TextDecoder().decode(a)}catch(e){return""}}

const CATNAME={lip:"립",nail:"네일",cheek:"블러셔"};
function nearestIn(list,ax){
  let best=null,bv=Infinity;
  (list||[]).forEach(r=>{
    const d=1.0*Math.pow(r.W-ax.W,2)+1.2*Math.pow(r.D-ax.D,2)+1.0*Math.pow(r.S-ax.S,2)+0.5*Math.pow(r.T-ax.T,2);
    if(d<bv){bv=d;best=r}
  });
  return best;
}
function hexAxes(h,t){
  const[r,g,b]=rgb(h).map(v=>v/255);
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
  let hd=0,sa=0;
  if(mx!==mn){const d=mx-mn; sa=l>.5?d/(2-mx-mn):d/(mx+mn);
    hd=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4); hd*=60;}
  const hu=hd>180?hd-360:hd;
  return{W:Math.max(-1,Math.min(1,(hu+3)/22)),D:Math.max(0,Math.min(1,(0.72-l)/0.44)),
         S:Math.max(0,Math.min(1,(sa-0.20)/0.55)),T:t};
}

function canvasLines(ctx,text,x,y,width,lineHeight){let line='';for(const word of text.split(/\s+/)){const next=line?line+' '+word:word;if(ctx.measureText(next).width>width&&line){ctx.fillText(line,x,y);y+=lineHeight;line='';}if(ctx.measureText(word).width>width){for(const c of word){if(ctx.measureText(line+c).width>width&&line){ctx.fillText(line,x,y);y+=lineHeight;line='';}line+=c;}}else line=line?line+' '+word:word;}if(line)ctx.fillText(line,x,y);return y+lineHeight;}

function showColorExport(status,blob,filename,alt){
 const appleMobile=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const prior=status.nextElementSibling;if(prior?.classList.contains('export-preview')){if(prior.dataset.objectUrl)URL.revokeObjectURL(prior.dataset.objectUrl);prior.remove();}
 const url=URL.createObjectURL(blob),preview=document.createElement('details');preview.className='export-preview';preview.open=true;preview.dataset.objectUrl=url;
 const summary=document.createElement('summary');summary.textContent='저장할 이미지 보기';
 const img=document.createElement('img');img.alt=alt;img.style.width='100%';img.style.height='auto';
 const download=document.createElement('a');download.className='ghost';download.textContent='PNG 파일 저장';download.href=url;download.download=filename;
 const open=document.createElement('a');open.className='link';open.textContent='이미지 새 창에서 열기';open.href=url;open.target='_blank';open.rel='noopener';
 preview.append(summary,img);if(!appleMobile)preview.append(download);preview.append(open);status.after(preview);
 let share=null;
 const photoHelp='아래 이미지를 길게 눌러 사진에 저장해 주세요. 메뉴가 없으면 Safari에서 열어 주세요.';
 if(typeof File!=='undefined'&&navigator.share&&navigator.canShare){
  const file=new File([blob],filename,{type:'image/png'});let canShare=false;try{canShare=navigator.canShare({files:[file]});}catch(e){}
  if(canShare){share=document.createElement('button');share.className='ghost';share.textContent=appleMobile?'사진첩에 저장':'이미지 저장 / 공유';share.onclick=async()=>{
   status.textContent=appleMobile?'공유 창에서 ‘이미지 저장’을 선택하면 사진 앱에 저장돼요.':'공유 창에서 저장하거나 공유할 곳을 선택해 주세요.';
   try{await navigator.share({files:[file]});}catch(e){if(e.name==='AbortError'){status.textContent=appleMobile?'저장을 취소했어요. 사진첩에 저장을 누르면 다시 열 수 있어요.':'공유를 취소했어요.';}else{status.textContent=appleMobile?'공유 창을 열지 못했어요. '+photoHelp:'공유 창을 열지 못했어요. PNG 파일 저장을 누르거나 이미지를 길게 눌러 저장해 주세요.';}}
  };preview.insertBefore(share,img);}
 }
 // Keep the PNG URL alive while its preview and save controls are available.
 const ready=appleMobile?(share?'‘사진첩에 저장’을 누른 뒤 공유 창의 ‘이미지 저장’을 선택해 주세요.':photoHelp):'이미지가 준비됐어요. PNG 파일 저장을 누르거나 이미지를 길게 눌러 저장해 주세요.';
 status.textContent=ready;
 img.onload=()=>{if(!appleMobile){try{download.click();}catch(e){/* The visible save link remains usable. */}}};
 img.onerror=()=>{status.textContent=appleMobile?'미리보기를 표시하지 못했어요. '+(share?'사진첩에 저장을 눌러주세요.':'이미지 새 창에서 열기를 눌러주세요.'):'미리보기를 표시하지 못했어요. PNG 파일 저장이나 이미지 새 창에서 열기를 눌러주세요.';};img.src=url;
 // Open the iOS sheet immediately if image generation retained the tap activation.
 // Otherwise the photo button supplies a fresh tap, without downloading to Files.
 if(appleMobile&&share&&navigator.userActivation?.isActive)share.click();
}

async function saveColorImage(friend,own=false){

 const paragraph=(value,y,size=28,width=820)=>{ctx.fillStyle='#665440';ctx.textAlign='center';ctx.font='400 '+size+'px "Noto Serif KR", serif';return canvasLines(ctx,value,540,y,width,size*1.8);};
