const RMIN={W:-2.7,D:-3.6,S:-4.0,T:-3.8}, RMAX={W:3.2,D:4.4,S:4.7,T:4.1};
const AMIN={W:-1,D:0,S:0,T:0}, AMAX={W:1,D:.94,S:.96,T:1};
const WG={W:1,D:1.2,S:1,T:.5};
const AX=["W","D","S","T"];
const PHRASE={W:["따뜻하게","서늘하게"],D:["깊게","환하게"],S:["또렷하게","은은하게"],T:["부드럽게","담백하게"]};
const TRAIT=[["다정함","W"],["낯가림","D"],["충동성","S"],["여운","T"]];

function scoreOf(ans){
  const r={W:0,D:0,S:0,T:0};
  ans.forEach((oi,qi)=>{const w=Q[qi].o[oi][2];for(const k in w)r[k]+=w[k];});
  const p={};AX.forEach(a=>{const t=(r[a]-RMIN[a])/(RMAX[a]-RMIN[a]);p[a]=AMIN[a]+t*(AMAX[a]-AMIN[a]);});
  return p;
}
function nearest(p,useBias){
  let best=null,bv=Infinity;
  for(const a of ARCH){let d=0;AX.forEach(k=>{d+=WG[k]*Math.pow(p[k]-a[k],2)});
    if(useBias)d-=BIAS[a.s];if(d<bv){bv=d;best=a}}
  return best;
}
const bySlug=s=>ARCH.find(a=>a.s===s);
const rgb=h=>{const x=h.replace("#","");return[0,2,4].map(i=>parseInt(x.substr(i,2),16))};
const hex=(r,g,b)=>"#"+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("").toUpperCase();
function lum(h){const[r,g,b]=rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*r+.7152*g+.0722*b}
const isLight=h=>lum(h)>0.45;
function lab(h){
  let[r,g,b]=rgb(h).map(v=>v/255);
  const li=c=>c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4);
  r=li(r);g=li(g);b=li(b);
  const X=(.4124564*r+.3575761*g+.1804375*b)/.95047,Y=(.2126729*r+.7151522*g+.0721750*b),
        Z=(.0193339*r+.1191920*g+.9503041*b)/1.08883;
  const f=t=>t>216/24389?Math.cbrt(t):(841/108)*t+4/29;
  const fx=f(X),fy=f(Y),fz=f(Z);return[116*fy-16,500*(fx-fy),200*(fy-fz)];
}
function lab2hex(L,A,B){
  const fy=(L+16)/116,fx=fy+A/500,fz=fy-B/200;
  const g=t=>{const t3=t*t*t;return t3>216/24389?t3:(t-4/29)*108/841};
  let X=g(fx)*.95047,Y=g(fy),Z=g(fz)*1.08883;
  let r=3.2404542*X-1.5371385*Y-0.4985314*Z,gg=-0.9692660*X+1.8760108*Y+0.0415560*Z,b=0.0556434*X-0.2040259*Y+1.0572252*Z;
  const s=c=>{c=c<=0.0031308?12.92*c:1.055*Math.pow(Math.max(c,0),1/2.4)-0.055;return c*255};
  return hex(s(r),s(gg),s(b));
}
function deltaE(h1,h2){
  const A=lab(h1),B=lab(h2);
  const L1=A[0],a1=A[1],b1=A[2],L2=B[0],a2=B[1],b2=B[2];
  const C1=Math.hypot(a1,b1),C2=Math.hypot(a2,b2),Cb=(C1+C2)/2;
  const cb7=Math.pow(Cb,7),p25=Math.pow(25,7);
  const G=.5*(1-Math.sqrt(cb7/(cb7+p25)||0));
  const a1p=(1+G)*a1,a2p=(1+G)*a2;
  const C1p=Math.hypot(a1p,b1),C2p=Math.hypot(a2p,b2);
  const rad=d=>d*Math.PI/180;
  const h1p=(Math.atan2(b1,a1p)*180/Math.PI+360)%360,h2p=(Math.atan2(b2,a2p)*180/Math.PI+360)%360;
  const dLp=L2-L1,dCp=C2p-C1p;let dhp=0;
  if(C1p*C2p!==0){dhp=h2p-h1p;if(dhp>180)dhp-=360;else if(dhp<-180)dhp+=360;}
  const dHp=2*Math.sqrt(C1p*C2p)*Math.sin(rad(dhp)/2);
  const Lbp=(L1+L2)/2,Cbp=(C1p+C2p)/2;let hbp;
  if(C1p*C2p===0)hbp=h1p+h2p;
  else if(Math.abs(h1p-h2p)<=180)hbp=(h1p+h2p)/2;
  else hbp=(h1p+h2p<360)?(h1p+h2p+360)/2:(h1p+h2p-360)/2;
  const T=1-.17*Math.cos(rad(hbp-30))+.24*Math.cos(rad(2*hbp))+.32*Math.cos(rad(3*hbp+6))-.20*Math.cos(rad(4*hbp-63));
  const dth=30*Math.exp(-Math.pow((hbp-275)/25,2));
  const cbp7=Math.pow(Cbp,7),Rc=2*Math.sqrt(cbp7/(cbp7+p25)||0);
  const Sl=1+(.015*Math.pow(Lbp-50,2))/Math.sqrt(20+Math.pow(Lbp-50,2));
  const Sc=1+.045*Cbp,Sh=1+.015*Cbp*T,Rt=-Math.sin(rad(2*dth))*Rc;
  return Math.sqrt(Math.pow(dLp/Sl,2)+Math.pow(dCp/Sc,2)+Math.pow(dHp/Sh,2)+Rt*(dCp/Sc)*(dHp/Sh));
}
function judge(mine,theirs){
  if(mine.s===theirs.s)return"나를 정확히 알고 있는 친구";
  if(deltaE(mine.h,theirs.h)<18)return"반 발짝 옆에서 나를 보는 친구";
  let ax="W",mx=0;
  AX.forEach(k=>{const d=theirs[k]-mine[k];if(Math.abs(d)>Math.abs(mx)){mx=d;ax=k}});
  return"생각보다 나를 더 "+PHRASE[ax][mx>0?0:1]+" 보는 친구";
}

/* Lab 색상각 실측 기준 — HSL 아님 */
const HUE=[[320,340,"Berry"],[340,353,"Fuchsia"],[353,360,"Rose"],[0,2,"Rose"],
           [2,14,"Pink"],[14,24,"Mauve"],[24,34,"Cherry"],[34,44,"Coral"],
           [44,54,"Peach"],[54,80,"Cocoa"]];
const MOD=[[70,"Pale"],[58,"Soft"],[46,""],[34,"Deep"],[0,"Dark"]];
const MAT=[[.75,"Glow"],[.50,"Silk"],[.20,"Satin"],[0,"Velvet"]];
function hueName(hd,C){
  if(C<15)return"Nude";
  for(const x of HUE){if(x[0]<=hd&&hd<x[1])return x[2]}
  return"Rose";
}
function ourColor(a,b){
  const A=lab(a.h),B=lab(b.h);
  const L=(A[0]+B[0])/2,aa=(A[1]+B[1])/2,bb=(A[2]+B[2])/2;
  const h=lab2hex(L,aa,bb);
  const hd=(Math.atan2(bb,aa)*180/Math.PI+360)%360, C=Math.hypot(aa,bb);
  let hue=hueName(hd,C);
  if(C>=15&&C<24)hue="Dusty "+hue;
  const mod=(MOD.find(x=>L>=x[0])||MOD[MOD.length-1])[1];
  const t=(a.T+b.T)/2;
  const mat=(MAT.find(x=>t>=x[0])||MAT[MAT.length-1])[1];
  const de=deltaE(a.h,b.h);
  const rel=de<18?"닮은 두 사람이에요. 같은 걸 보고 비슷한 데서 웃는 편."
    :de<32?"조금 다른데 이상하게 잘 맞는 조합이에요."
    :"완전히 다른데 이상하게 오래 보게 되는 조합이에요.";
  return{hex:h,name:[mod,hue,mat].filter(Boolean).join(" "),rel:rel,de:Math.round(de)};
}
function serial(a,ans){
  let s=7;(ans||[]).forEach((v,i)=>s=(s*31+v*13+i)%997);
  s=(s+ARCH.indexOf(a)*83)%900+100;return String(s);
}

function enc(s){try{const b=new TextEncoder().encode(s);let t="";
  for(let i=0;i<b.length;i++)t+=String.fromCharCode(b[i]);
  return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}catch(e){return""}}
function dec(b){try{const t=b.replace(/-/g,"+").replace(/_/g,"/");
  const s=atob(t),a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);
  return new TextDecoder().decode(a)}catch(e){return""}}

  (mine?'<button class="ghost" id="own">내 결과 보기</button>':"")+'</div>');
  document.getElementById("back2").onclick=()=>viewReply(idx,from);
  const o=document.getElementById("own");
  if(o)o.onclick=()=>{clearHash();mine?viewResult(mine,JSON.parse(LS.get("ans")||"[]")):viewQ(0,[])};
}

/* 받은 사람이 되보내며 '우리의 색'을 만든다 */
function viewReply(theirIdx,fromName){
  resetAccent();
  const saved=LS.get("myname")||"";
  show('<p class="eyebrow">'+esc(fromName)+'에게 보내기</p>'+
  '<h2>'+esc(fromName)+' 하면<br>떠오르는 색은?</h2>'+
  '<p class="lede">고르면 둘의 색이 섞여서 우리 둘만의 색이 만들어져요.</p>'+
  gridHTML()+'<div id="pk"></div>');
  pickWire(p=>{
    setAccent(p.h);
    document.getElementById("pk").innerHTML=
      '<div class="stack" style="margin-top:6px">'+
      '<label class="eyebrow" for="mn">내 이름 (최대 8자)</label>'+
      '<input type="text" id="mn" maxlength="8" placeholder="예) 더마릭" value="'+esc(saved)+'">'+
      '<p class="err hide" id="e0">이름을 입력해 주세요</p>'+
      '<button class="cta" id="mk">우리의 색 만들기 →</button></div>';
    const inp=document.getElementById("mn");
    inp.oninput=()=>document.getElementById("e0").classList.add("hide");
    document.getElementById("mk").onclick=()=>{
      const nm=clean(inp.value);
      if(!nm){document.getElementById("e0").classList.remove("hide");return}
      LS.set("myname",nm);
      location.hash="#p="+IDXC[theirIdx]+enc(fromName)+"~"+IDXC[ARCH.indexOf(p)]+enc(nm);
    };
  });
}

/* 우리의 색 */
function viewPair(payload){
  const half=payload.split("~");
  if(half.length<2){show('<h2>링크를 읽을 수 없어요</h2>');return}
  const aI=IDXC.indexOf(half[0].charAt(0)),aN=clean(dec(half[0].slice(1)))||"친구";
  const bI=IDXC.indexOf(half[1].charAt(0)),bN=clean(dec(half[1].slice(1)))||"나";
  const A=ARCH[aI],B=ARCH[bI];
  if(!A||!B){show('<h2>링크를 읽을 수 없어요</h2>');return}
  const our=ourColor(A,B);
  setAccent(our.hex);
  const url=baseUrl()+"#p="+payload;
  const msg=aN+"랑 "+bN+"의 색은 "+our.name+"\n"+url;
  show('<p class="eyebrow">You Two</p>'+
  '<div class="pair"><div class="col"><span class="pill">'+esc(bN)+'이 보는 '+esc(aN)+'</span>'+
  '<span class="blk" style="background:'+B.h+'"></span><span class="name-s">'+esc(B.n)+'</span></div>'+
  '<div class="col"><span class="pill">'+esc(aN)+'이 보는 '+esc(bN)+'</span>'+
  '<span class="blk" style="background:'+A.h+'"></span><span class="name-s">'+esc(A.n)+'</span></div></div>'+
  '<hr class="sep">'+
  '<p class="eyebrow">우리의 색</p>'+
  '<div class="ourfield'+(isLight(our.hex)?" dk":"")+'" style="background:'+our.hex+'">'+
  '<span style="font-family:var(--mono);font-size:11px;letter-spacing:.14em">'+our.hex+'</span></div>'+
  '<h2>'+esc(our.name)+'</h2>'+
  '<p class="copy">'+esc(our.rel)+'</p>'+
  '<hr class="sep">'+
  '<div class="stack"><button class="cta" id="cp">우리 카드 링크 복사하기</button>'+
  '<button class="ghost" id="own">'+(LS.get("slug")?"내 결과 보기":"내 색 만들어보기")+'</button></div>');
  document.getElementById("cp").onclick=async function(){
    const b=this;
    try{await navigator.clipboard.writeText(msg);b.textContent="복사됐어요"}
    catch(e){b.textContent="주소창의 링크를 복사해 주세요"}};
  document.getElementById("own").onclick=()=>{clearHash();
    const s=LS.get("slug");s&&bySlug(s)?viewResult(bySlug(s),JSON.parse(LS.get("ans")||"[]")):viewQ(0,[])};
}

function route(){
  const h=location.hash;
  if(h.indexOf("#p=")===0)return viewPair(h.slice(3));
  if(h.indexOf("#s=")===0){const p=h.slice(3);return viewGot(IDXC.indexOf(p.charAt(0)),dec(p.slice(1)))}
  const s=LS.get("slug");
  if(s&&bySlug(s))return viewResult(bySlug(s),JSON.parse(LS.get("ans")||"[]"));
  viewIntro();
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
