  s=(s+ARCH.indexOf(a)*83)%900+100;return String(s);
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean=s=>String(s).replace(/[^가-힣ㄱ-ㅎa-zA-Z0-9]/g,"").slice(0,8);
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
          set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function enc(s){try{const b=new TextEncoder().encode(s);let t="";
  for(let i=0;i<b.length;i++)t+=String.fromCharCode(b[i]);
  return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}catch(e){return""}}
function dec(b){try{const t=b.replace(/-/g,"+").replace(/_/g,"/");
  const s=atob(t),a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);
  return new TextDecoder().decode(a)}catch(e){return""}}
const baseUrl=()=>location.origin+location.pathname+location.search;
function clearHash(){try{history.replaceState(null,"",baseUrl())}catch(e){}}
function setAccent(h){
  document.documentElement.style.setProperty("--accent",h);
  document.documentElement.style.setProperty("--accent-ink",isLight(h)?"#1B1614":"#FFFFFF");
}
function resetAccent(){
  document.documentElement.style.setProperty("--accent","#8C3A50");
  document.documentElement.style.setProperty("--accent-ink","#FFFFFF");
}
const app=()=>document.getElementById("app");
function show(h){app().innerHTML=h;window.scrollTo(0,0)}

const TONE={ok:"b-ok",bad:"b-bad",hold:"b-hold"};
function prodHTML(slug){
  const rows=(typeof PROD!=="undefined"&&PROD[slug])||[];
  if(!rows.length)return'<p class="note">이 색의 제품은 준비 중이에요.</p>';
  return'<div class="plist">'+rows.map(function(r,i){
    const cls=TONE[r.tone]||"b-hold";
    const p=r.c?Number(r.c).toLocaleString("ko-KR")+"원":"가격 확인";
    const line=[r.u2?"평소 "+esc(r.u2):"",r.lo?"최저 "+esc(r.lo):""].filter(Boolean).join(" · ");
    const warn=r.w?'<div class="cav">최근 그래프의 움직임은 <b>대표 옵션이 바뀐 표기 변경</b>일 수 있어요. '+
      '옵션별 가격 관측이 '+r.ld+'일뿐이라 실제 인상·인하로 확정하지 않았습니다.</div>':"";
    return'<div class="pcard"><div class="prow">'+
      (r.i?'<img class="th" src="'+esc(r.i)+'" alt="" loading="lazy" style="background:'+esc(r.h)+'" onerror="this.removeAttribute(\'src\')">'
          :'<span class="th" style="background:'+esc(r.h)+'"></span>')+
      '<span class="bd"><span class="bn">'+esc(r.b)+'</span>'+
      '<span class="on">'+esc(r.o)+'</span>'+
      '<span class="pr">'+p+' <span class="badge '+cls+'">'+esc(r.tag)+'</span></span>'+
      (line?'<span class="usual">'+line+'</span>':"")+'</span>'+
      sparkHTML(r.s)+'</div>'+
      '<button class="why" data-w="'+i+'">왜? →</button>'+
      '<div class="whybox hide" id="wb'+i+'"><b>'+esc(r.t||"")+'</b>'+
      (r.d?'<br>'+esc(r.d):"")+warn+
      '<br><a class="oy" href="'+esc(r.u)+'" target="_blank" rel="noopener">가격 이력 전체 보기 →</a></div></div>';
  }).join("")+'</div>';
}
function sparkHTML(sp){
  if(!sp||!sp.p)return"";
  const pts=sp.p.split(" "), last=pts[pts.length-1].split(",");
  return'<span class="spk"><svg viewBox="0 0 104 26" preserveAspectRatio="none" role="img" aria-label="가격 추이">'+
    '<polyline points="'+sp.p+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.6" fill="currentColor"/></svg>'+
    '<span class="spkl">표시가 '+sp.n+'일</span></span>';
}
function wireWhy(){
  app().querySelectorAll(".why").forEach(b=>b.onclick=()=>{
    const x=document.getElementById("wb"+b.dataset.w);
    const open=!x.classList.contains("hide");
    x.classList.toggle("hide");b.textContent=open?"왜? →":"접기";
  });
}
function gridHTML(){
  return'<div class="grid">'+ARCH.map((a,i)=>
    '<button class="sw" data-i="'+i+'" aria-pressed="false">'+
    '<span class="chip" style="background:'+a.h+'"></span><span class="nm">'+esc(a.n)+'</span></button>').join("")+'</div>';
}
function pickWire(cb){
  app().querySelectorAll(".sw").forEach(b=>b.onclick=()=>{
    app().querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");cb(ARCH[+b.dataset.i]);
  });
}
function heroHTML(a,ans){
  return'<div class="pant"><div class="fill" style="background:'+a.h+'"></div>'+
    '<div class="band"><div class="bt"><span>Themaric</span><span>My Lip No. '+serial(a,ans)+'</span></div>'+
    '<div class="bn">'+esc(a.n)+'</div>'+
    '<div class="bh">'+a.h+'</div>'+
    '<div class="bs">'+a.tone+'</div></div></div>';
}

function viewIntro(){
  resetAccent();
  show('<h1>내가 하나의 색이라면<br>어떤 이름일까?</h1>'+
  '<p class="lede">여덟 번의 선택으로, 열두 개의 색 중 하나가 이름을 갖고 돌아와요.</p>'+
  '<div class="strip">'+ARCH.map(a=>'<span style="background:'+a.h+'"></span>').join("")+'</div>'+
  '<div class="stack"><button class="cta" id="go">내 컬러 만들기 →</button>'+
  (LS.get("slug")?'<button class="ghost" id="mine">내 결과 다시 보기</button>':"")+'</div>'+
  '<p class="note">30초 · 회원가입 없음</p>');
  document.getElementById("go").onclick=()=>viewQ(0,[]);
  const m=document.getElementById("mine");
  if(m)m.onclick=()=>viewResult(bySlug(LS.get("slug")),JSON.parse(LS.get("ans")||"[]"));
}

function viewQ(i,ans){
  resetAccent();
  const q=Q[i],n=q.o.length;
  const cls=q.k==="row"?"q3":(n>=4?"q4":"q2");
  const cards=q.o.map((o,k)=>{
    let inner;
    if(q.k==="swatch") inner='<span class="swm" style="background:'+o[1]+'"></span><span class="lb">'+esc(o[0])+'</span>';
    else if(q.k==="word") inner='<span class="word">'+esc(o[0])+'</span>';
    else if(q.k==="row") inner='<span class="em">'+o[1]+'</span><span class="lb">'+esc(o[0])+'</span>';
    else inner='<span class="em">'+o[1]+'</span><span class="lb">'+esc(o[0])+'</span>';
    return'<button class="qc'+(q.k==="row"?" row":"")+'" data-k="'+k+'">'+inner+'</button>';
  }).join("");
  show('<p class="eyebrow">'+(i+1)+' / '+Q.length+'</p>'+
  '<div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div>'+
  '<h2>'+esc(q.q)+'</h2>'+
  '<div class="qgrid '+cls+'">'+cards+'</div>'+
  (i>0?'<button class="link" id="back">이전</button>':""));
  app().querySelectorAll(".qc").forEach(b=>b.onclick=()=>{
    const na=ans.slice(0,i);na.push(+b.dataset.k);
    if(i+1<Q.length)viewQ(i+1,na);else finish(na);
  });
  const bk=document.getElementById("back");if(bk)bk.onclick=()=>viewQ(i-1,ans);
}

function finish(ans){
  const a=nearest(scoreOf(ans),true);
  LS.set("slug",a.s);LS.set("ans",JSON.stringify(ans));
  const p=LS.get("pending");
  if(p){LS.set("pending","");location.hash="#s="+p;return}
  viewResult(a,ans);
}

function viewResult(a,ans){
  setAccent(a.h);
  show(heroHTML(a,ans)+
  '<p class="copy">'+esc(a.c)+'</p>'+
  '<hr class="sep">'+
  '<p class="eyebrow">이 색을 조금 더 들여다보면</p>'+
  '<div class="axes">'+TRAIT.map(t=>{
    const v=t[1]==="W"?(a[t[1]]+1)/2:a[t[1]];
    return'<div class="ax"><span>'+t[0]+'</span><span class="track"><i style="width:'+
      Math.round(v*100)+'%"></i></span><span class="val">'+Math.round(v*100)+'</span></div>';
  }).join("")+'</div>'+
  '<hr class="sep">'+
  '<div class="card"><h2 style="font-size:20px">이 색이 떠오르는 사람이 있어요?</h2>'+
  '<p class="note" style="margin:0">친구를 떠올리며 색을 하나 골라 보내주세요.</p>'+
  '<button class="cta" id="send">생각나는 친구 색깔 보내주기</button></div>'+
  '<div class="card"><h2 style="font-size:20px">남들이 보는 나의 색은?</h2>'+
  '<p class="note" style="margin:0">친구가 고른 색이 나에게 돌아와요. 둘 다 주고받으면 우리 둘만의 색이 만들어져요.</p>'+
  '<button class="cta" id="ask">친구에게 링크 보내기</button></div>'+
  '<hr class="sep">'+
  '<p class="eyebrow">그런데 잠깐</p>'+
  '<h2 style="font-size:21px">이 색, 진짜로 찾아봤어요</h2>'+
  prodHTML(a.s)+
  '<p class="note">배지는 <b>평소 판매가와 비교한 지금 가격</b>이에요. 더마릭이 매일 관측한 올리브영 가격 기준이고, 표시 할인율은 쓰지 않았습니다. 근거는 왜? 를 눌러 보세요.</p>'+
  '<button class="link" id="redo">다시 하기</button>');
  wireWhy();
  document.getElementById("send").onclick=()=>viewPick({
    eyebrow:"친구에게 보내기", title:"이 사람 하면<br>떠오르는 색은?",
    sub:"친구를 떠올리며 색 하나를 골라주세요.", back:()=>viewResult(a,ans)});
  document.getElementById("ask").onclick=async function(){
    const nm=LS.get("myname")||"";
    const url=baseUrl()+"#a="+(nm?enc(nm):"");
    const msg=(nm||"나")+" 하면 떠오르는 색 하나만 골라줘\n"+url;
    const b=this;
    try{await navigator.clipboard.writeText(msg);b.textContent="복사됐어요 · 친구에게 붙여넣기"}
    catch(e){b.textContent="복사 실패 — 주소창 링크를 보내주세요"}};
  document.getElementById("redo").onclick=()=>{LS.set("slug","");viewQ(0,[])};
}

function viewPick(o){
  resetAccent();
  const saved=LS.get("myname")||"";
  show('<p class="eyebrow">'+o.eyebrow+'</p>'+
  '<h2>'+o.title+'</h2>'+
  '<p class="lede">'+esc(o.sub)+'</p>'+
  gridHTML()+'<div id="pk"></div>'+
  (o.back?'<button class="link" id="back">돌아가기</button>':""));
  pickWire(p=>{
    setAccent(p.h);
    document.getElementById("pk").innerHTML=
      '<div class="stack" style="margin-top:6px">'+
      '<label class="eyebrow" for="mn">내 이름 (최대 8자)</label>'+
      '<input type="text" id="mn" maxlength="8" placeholder="예) 더마릭" value="'+esc(saved)+'">'+
      '<p class="err hide" id="e0">이름을 입력해 주세요</p>'+
      '<button class="cta" id="mk">'+esc(p.n)+' 보내기</button></div>';
    const inp=document.getElementById("mn");
    inp.oninput=()=>document.getElementById("e0").classList.add("hide");
    document.getElementById("mk").onclick=async()=>{
      const nm=clean(inp.value);
      if(!nm){document.getElementById("e0").classList.remove("hide");return}
      LS.set("myname",nm);
      const url=baseUrl()+"#s="+IDXC[ARCH.indexOf(p)]+enc(nm);
      const msg=nm+"이(가) 너한테 색 하나를 보냈어\n"+url;
      let ok=true;
      try{await navigator.clipboard.writeText(msg)}catch(e){ok=false}
      setAccent(p.h);
      show('<p class="eyebrow">'+(ok?"링크가 복사됐어요":"아래 링크를 복사해 주세요")+'</p>'+
      heroHTML(p,[ARCH.indexOf(p)])+
      '<p class="copy">'+esc(p.c)+'</p>'+
      '<p class="lede">친구가 이 카드를 그대로 받아요.</p>'+
      '<div class="share">'+esc(msg)+'</div>'+
      '<div class="stack"><button class="cta" id="cp">다시 복사하기</button>'+
      '<button class="ghost" id="hm">내 결과로</button></div>');
      document.getElementById("cp").onclick=async function(){
        const b=this;
        try{await navigator.clipboard.writeText(msg);b.textContent="복사됐어요"}
        catch(e){b.textContent="위 내용을 길게 눌러 복사해 주세요"}};
      document.getElementById("hm").onclick=()=>{clearHash();
        const sl=LS.get("slug");sl&&bySlug(sl)?viewResult(bySlug(sl),JSON.parse(LS.get("ans")||"[]")):viewIntro()};
    };
  });
  if(o.back)document.getElementById("back").onclick=o.back;
}

/* 친구가 보낸 립을 받는 화면 */
function viewGot(idx,rawNick){
  const from=clean(rawNick||"")||"친구";
  const t=ARCH[idx];
  if(!t){show('<h2>링크를 읽을 수 없어요</h2><p class="lede">주소가 잘린 것 같아요. 친구에게 다시 받아 주세요.</p>');return}
  setAccent(t.h);
  const ms=LS.get("slug"),mine=ms?bySlug(ms):null;
  show('<p class="eyebrow">'+esc(from)+'이(가) 보냈어요</p>'+
  heroHTML(t,[idx])+
  '<p class="copy">'+esc(t.c)+'</p>'+
  '<p class="lede">'+esc(from)+'은(는) 이 색을 보면서 당신이 생각났대요.</p>'+
  (mine?'<div class="card"><p class="note" style="margin:0">내 결과는 '+esc(mine.n)+'</p>'+
       '<p style="margin:0;font-size:15px">'+esc(judge(mine,t))+'</p></div>':"")+
  '<hr class="sep">'+
  '<div class="stack"><button class="cta" id="back2">'+esc(from)+'에게도 색 보내기 →</button>'+
  (mine?'':'<button class="ghost" id="own">내 색 만들어보기</button>')+
  (mine?'<button class="ghost" id="own">내 결과 보기</button>':"")+'</div>');
  document.getElementById("back2").onclick=()=>viewReply(idx,from);
  const o=document.getElementById("own");
  if(o)o.onclick=()=>{clearHash();mine?viewResult(mine,JSON.parse(LS.get("ans")||"[]")):viewQ(0,[])};
}

/* 받은 사람이 되보내며 '우리의 색'을 만든다 */
function viewReply(theirIdx,fromName){
  resetAccent();
  const saved=LS.get("myname")||"";
  show('<p class="eyebrow">'+esc(fromName)+'에게 보내기</p>'+
  '<h2>'+esc(fromName)+' 하면<br>떠오르는 색은?</h2>'+
  '<p class="lede">고르면 둘의 색이 섞여서 우리 둘만의 색이 만들어져요.</p>'+
  gridHTML()+'<div id="pk"></div>');
  pickWire(p=>{
    setAccent(p.h);
    document.getElementById("pk").innerHTML=
      '<div class="stack" style="margin-top:6px">'+
      '<label class="eyebrow" for="mn">내 이름 (최대 8자)</label>'+
      '<input type="text" id="mn" maxlength="8" placeholder="예) 더마릭" value="'+esc(saved)+'">'+
      '<p class="err hide" id="e0">이름을 입력해 주세요</p>'+
      '<button class="cta" id="mk">우리의 색 만들기 →</button></div>';
    const inp=document.getElementById("mn");
    inp.oninput=()=>document.getElementById("e0").classList.add("hide");
    document.getElementById("mk").onclick=()=>{
      const nm=clean(inp.value);
      if(!nm){document.getElementById("e0").classList.remove("hide");return}
      LS.set("myname",nm);
      location.hash="#p="+IDXC[theirIdx]+enc(fromName)+"~"+IDXC[ARCH.indexOf(p)]+enc(nm);
    };
  });
}

/* 우리의 색 */
function viewPair(payload){
  const half=payload.split("~");
  if(half.length<2){show('<h2>링크를 읽을 수 없어요</h2>');return}
  const aI=IDXC.indexOf(half[0].charAt(0)),aN=clean(dec(half[0].slice(1)))||"친구";
  const bI=IDXC.indexOf(half[1].charAt(0)),bN=clean(dec(half[1].slice(1)))||"나";
  const A=ARCH[aI],B=ARCH[bI];
  if(!A||!B){show('<h2>링크를 읽을 수 없어요</h2>');return}
  const our=ourColor(A,B);
  setAccent(our.hex);
  const url=baseUrl()+"#p="+payload;
  const msg=aN+"랑 "+bN+"의 색은 "+our.name+"\n"+url;
  show('<p class="eyebrow">You Two</p>'+
  '<div class="pair"><div class="col"><span class="pill">'+esc(bN)+'이 보는 '+esc(aN)+'</span>'+
  '<span class="blk" style="background:'+B.h+'"></span><span class="name-s">'+esc(B.n)+'</span></div>'+
  '<div class="col"><span class="pill">'+esc(aN)+'이 보는 '+esc(bN)+'</span>'+
  '<span class="blk" style="background:'+A.h+'"></span><span class="name-s">'+esc(A.n)+'</span></div></div>'+
  '<hr class="sep">'+
  '<p class="eyebrow">우리의 색</p>'+
  '<div class="ourfield'+(isLight(our.hex)?" dk":"")+'" style="background:'+our.hex+'">'+
  '<span style="font-family:var(--mono);font-size:11px;letter-spacing:.14em">'+our.hex+'</span></div>'+
  '<h2>'+esc(our.name)+'</h2>'+
  '<p class="copy">'+esc(our.rel)+'</p>'+
  '<hr class="sep">'+
  '<div class="stack"><button class="cta" id="cp">우리 카드 링크 복사하기</button>'+
  '<button class="ghost" id="own">'+(LS.get("slug")?"내 결과 보기":"내 색 만들어보기")+'</button></div>');
  document.getElementById("cp").onclick=async function(){
    const b=this;
    try{await navigator.clipboard.writeText(msg);b.textContent="복사됐어요"}
    catch(e){b.textContent="주소창의 링크를 복사해 주세요"}};
  document.getElementById("own").onclick=()=>{clearHash();
    const s=LS.get("slug");s&&bySlug(s)?viewResult(bySlug(s),JSON.parse(LS.get("ans")||"[]")):viewQ(0,[])};
}

function route(){
  const h=location.hash;
  if(h.indexOf("#a=")===0){
    const who=clean(dec(h.slice(3)))||"친구";
    return viewPick({eyebrow:who+"이(가) 물어봤어요", title:esc(who)+' 하면<br>떠오르는 색은?',
      sub:"가장 먼저 눈이 가는 색 하나를 골라주세요.", back:null});
  }
  if(h.indexOf("#p=")===0)return viewPair(h.slice(3));
  if(h.indexOf("#s=")===0){const p=h.slice(3);return viewGot(IDXC.indexOf(p.charAt(0)),dec(p.slice(1)))}
  const s=LS.get("slug");
  if(s&&bySlug(s))return viewResult(bySlug(s),JSON.parse(LS.get("ans")||"[]"));
  viewIntro();
}
window.addEventListener("hashchange",route);
route();
</script>

</html>
