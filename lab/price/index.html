  <p class="lead">샀던 화장품과 기억나는 가격을 넣어보세요. 더마릭이 하루 두 번 관측한 가격대 중

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won=n=>Number(n).toLocaleString("ko-KR")+"원";
const VD="../../verdicts/";
let INDEX=null, LOADING=false, PICK=null, ACROWS=[], ACI=-1, TIMER=null;

/* ───────── 검색 인덱스 ───────── */
async function loadIndex(){
  if(INDEX) return INDEX;
  if(LOADING) return null;
  LOADING=true;
  try{
    const r=await fetch(VD+"index.json",{cache:"force-cache"});
    INDEX=r.ok?((await r.json()).items||{}):{};
  }catch(e){ INDEX={}; }
  LOADING=false;
  return INDEX;
}
function hi(text,terms){
  let out=esc(text);
  terms.forEach(t=>{
    if(!t) return;
    const re=new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
    out=out.replace(re,"<mark>$1</mark>");
  });
  return out;
}

/* ───────── 자동완성 ───────── */
function closeAC(){ $("#ac").classList.add("hide"); $("#q").setAttribute("aria-expanded","false"); ACI=-1; }
function openAC(html){ const a=$("#ac"); a.innerHTML=html; a.classList.remove("hide"); $("#q").setAttribute("aria-expanded","true"); }

async function suggest(){
  const q=($("#q").value||"").trim();
  if(q.length<2){ closeAC(); return; }
  if(!INDEX){
    openAC('<div class="msg">상품 목록을 불러오는 중이에요…</div>');
    await loadIndex();
    if(($("#q").value||"").trim()!==q) return;
  }
  if(!INDEX || !Object.keys(INDEX).length){
    openAC('<div class="msg">상품 목록을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</div>'); return;
  }
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits=[];
  for(const g in INDEX){
    const it=INDEX[g];
    const hay=((it.name||"")+" "+(it.brand||"")).toLowerCase();
    if(terms.every(t=>hay.includes(t))) hits.push([g,it]);
  }
  if(!hits.length){ openAC('<div class="msg">찾는 상품이 없어요. 브랜드명만으로도 검색해 보세요.</div>'); return; }
  hits.sort((a,b)=>(a[1].name||"").length-(b[1].name||"").length);
  ACROWS=hits.slice(0,8);
  openAC(ACROWS.map(([g,it],i)=>
    '<button type="button" class="row" role="option" data-i="'+i+'">'+
    (it.img?'<img src="'+esc(it.img)+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">':'<img alt="">')+
    '<span class="t"><span class="b">'+hi(it.brand||"",terms)+'</span>'+
    '<span class="n">'+hi(it.name||"",terms)+'</span></span></button>').join(""));
  $("#ac").querySelectorAll(".row").forEach(b=>b.onmousedown=e=>{e.preventDefault(); choose(+b.dataset.i);});
  ACI=-1;
}
function moveAC(d){
  const rows=$("#ac").querySelectorAll(".row");
  if(!rows.length) return;
  ACI=(ACI+d+rows.length)%rows.length;
  rows.forEach((r,i)=>r.classList.toggle("on",i===ACI));
  rows[ACI].scrollIntoView({block:"nearest"});
}
async function choose(i){
  const ent=ACROWS[i]; if(!ent) return;
  closeAC();
  await setProduct(ent[0]);
}

/* ───────── 상품 선택 ───────── */
async function setProduct(gno){
  const slot=$("#pslot");
  slot.innerHTML='<label class="lbl">상품</label><p class="note">불러오는 중…</p>';
  let j=null;
  try{ const r=await fetch(VD+gno+".json",{cache:"force-cache"}); if(r.ok) j=await r.json(); }catch(e){}
  if(!j){ PICK=null; resetProduct("그 상품의 가격 기록을 찾지 못했어요."); return; }
  PICK={gno:gno,j:j};
  slot.innerHTML='<label class="lbl">상품</label>'+
    '<div class="prod">'+
    (j.img?'<img src="'+esc(j.img)+'" alt="" onerror="this.style.visibility=\'hidden\'">':'<img alt="">')+
    '<span class="t"><span class="b">'+esc(j.brand||"")+'</span>'+
    '<span class="n">'+esc(j.name||"")+'</span></span></div>'+
    '<button class="linkbtn" id="chg">다른 상품 고르기</button>';
  $("#chg").onclick=()=>resetProduct();
  sync();
  if(!$("#p").value) $("#p").focus();
}
function resetProduct(msg){
  PICK=null;
  $("#pslot").innerHTML='<label class="lbl" for="q">상품</label>'+
    '<div class="field"><input type="text" id="q" placeholder="예) 아누아 어성초 토너" autocomplete="off" '+
    'role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="ac">'+
    '<div class="ac hide" id="ac" role="listbox"></div></div>'+
    (msg?'<p class="err">'+esc(msg)+'</p>':'<p class="note" style="margin-top:6px">브랜드명을 같이 넣으면 더 잘 찾아요.</p>');
  wireSearch();
  $("#out").innerHTML="";
  history.replaceState(null,"",location.pathname);
  sync();
  $("#q").focus();
}
function wireSearch(){
  const q=$("#q");
  q.oninput=()=>{ clearTimeout(TIMER); TIMER=setTimeout(suggest,130); };
  q.onfocus=()=>{ loadIndex(); if((q.value||"").trim().length>=2) suggest(); };
  q.onblur=()=>setTimeout(closeAC,120);
  q.onkeydown=e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); moveAC(1); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); moveAC(-1); }
    else if(e.key==="Enter"){ e.preventDefault(); if(ACI>=0) choose(ACI); else if(ACROWS.length) choose(0); }
    else if(e.key==="Escape"){ closeAC(); }
  };
}
function priceVal(){ return parseInt(($("#p").value||"").replace(/[^0-9]/g,""),10); }
function sync(){ $("#ok").disabled = !(PICK && priceVal()>0); }

/* ───────── 분석 ───────── */
function analyze(series, mine){
  const prices=series.map(p=>p.price).filter(p=>p);
  const n=prices.length, cnt={};
  prices.forEach(p=>cnt[p]=(cnt[p]||0)+1);
  const levels=Object.keys(cnt).map(Number).sort((a,b)=>a-b).map(p=>({p:p,c:cnt[p]}));
  const cheaper=prices.filter(p=>p<mine).length;
  const same=cnt[mine]||0;
  return{n:n, levels:levels, cheaper:cheaper, same:same, pricier:n-cheaper-same,
    mid:(cheaper+same/2)/n, min:levels[0].p, max:levels[levels.length-1].p,
    mode:levels.slice().sort((a,b)=>b.c-a.c)[0].p};
}
function headline(a,mine){
  if(mine< a.min)  return["관측된 어떤 날보다 쌌어요","이 기간엔 이만큼 싼 값이 나온 적이 없어요."];
  if(mine===a.min) return["관측 최저가예요","이보다 싼 날은 없었어요."];
  if(mine> a.max)  return["관측된 어떤 날보다 비쌌어요","이 기간엔 이보다 싼 값만 나왔어요."];
  if(mine===a.max) return["가장 비쌌던 가격이에요","관측된 날 대부분이 이보다 쌌어요."];
  const r=a.mid;
  if(r<=0.15) return["싸게 산 편이에요","이보다 싼 날이 드물었어요."];
  if(r<=0.42) return["조금 싸게 샀어요","중간보다는 아래였어요."];
  if(r<=0.62) return["평범한 가격이었어요","이 상품이 자주 머무는 가격대예요."];
  if(r<=0.85) return["비싼 편이었어요","더 싼 날이 꽤 있었어요."];
  return["거의 가장 비쌌어요","대부분의 날이 이보다 쌌어요."];
}

/* ───────── 결과 ───────── */
function render(){
  if(!PICK) return;
  const mine=priceVal();
  if(!mine || mine<100 || mine>3000000){ $("#pe").classList.remove("hide"); return; }
  $("#pe").classList.add("hide");
  const j=PICK.j, out=$("#out");
  const series=((j.chart||{}).series||[]).filter(p=>p.price);
  history.replaceState(null,"","#g="+PICK.gno+"&p="+mine);

  if(series.length<8){
    out.innerHTML='<div class="rule"></div><h2>아직 비교할 만큼 쌓이지 않았어요</h2>'+
      '<p class="lead" style="margin-top:8px">이 상품은 관측 기록이 '+series.length+'회뿐이라 가격대를 말하기 어려워요. 관측은 매일 이어지고 있어요.</p>';
    out.scrollIntoView({behavior:"smooth",block:"start"}); return;
  }
  const a=analyze(series,mine), h=headline(a,mine);
  const first=(series[0].label||"").split("·")[0], last=(series[series.length-1].label||"").split("·")[0];
  const maxc=Math.max.apply(null,a.levels.map(l=>l.c));
  const inLv=a.levels.some(l=>l.p===mine);
  let rows=a.levels.map(l=>({p:l.p,c:l.c,me:l.p===mine}));
  if(!inLv) rows.push({p:mine,c:0,me:true});
  rows.sort((x,y)=>x.p-y.p);

  out.innerHTML='<div class="rule"></div>'+
  '<p class="eyebrow">'+esc(won(mine))+'에 샀다면</p>'+
  '<p class="verdict">'+esc(h[0])+'</p>'+
  '<p class="lead">'+esc(h[1])+' 관측 '+a.n+'회 중 — 더 싼 값 <b>'+a.cheaper+'회</b>'+
    (a.same?' · 같은 값 <b>'+a.same+'회</b>':"")+
    (a.pricier?' · 더 비싼 값 <b>'+a.pricier+'회</b>':"")+'.</p>'+
  '<div class="stats">'+
    '<div class="stat"><div class="k">관측 최저</div><div class="v">'+won(a.min)+'</div></div>'+
    '<div class="stat"><div class="k">가장 흔한 값</div><div class="v">'+won(a.mode)+'</div></div>'+
    '<div class="stat"><div class="k">관측 최고</div><div class="v">'+won(a.max)+'</div></div>'+
  '</div>'+
  '<div class="rule"></div>'+
  '<p class="eyebrow">가격대별 관측 횟수</p>'+
  '<div class="levels">'+rows.map(function(l){
    const cls="lv"+(l.me?" me":"")+(!l.me&&l.p<mine?" cheap":"");
    const w=maxc?Math.max(l.c/maxc*100,l.c?4:0):0;
    return'<div class="'+cls+'"><span class="p">'+won(l.p)+(l.me?'<span class="youtag">나</span>':"")+'</span>'+
      '<span class="track"><i style="width:'+w.toFixed(1)+'%"></i></span>'+
      '<span class="d">'+(l.c?l.c+"회":"관측 없음")+'</span></div>';
  }).join("")+'</div>'+
  '<p class="note" style="margin-top:10px">'+esc(first)+' ~ '+esc(last)+
    (j.chartSub?' · '+esc(j.chartSub):"")+' · 기록 '+a.n+'회</p>'+
  (!inLv?'<div class="cav" style="margin-top:14px">이 가격은 관측 기록에 없어요. 쿠폰·카드 할인이나 옵션(용량·구성)이 달랐을 수 있어요.</div>':"")+
  '<div class="cav" style="margin-top:10px">올리브영 목록에 <b>대표로 표시된 가격</b> 기준이에요. 옵션이 여러 개인 상품은 고른 옵션에 따라 실제 가격이 달랐을 수 있습니다.</div>'+
  '<div class="rule"></div>'+
  '<div class="form">'+
    '<button class="btn ghost" id="share">결과 링크 복사하기</button>'+
    '<a class="btn ghost" style="display:block;text-align:center;text-decoration:none;line-height:1.4" '+
      'href="../../?g='+esc(PICK.gno)+'&from=lab-price">이 상품 판정서 보기 →</a>'+
  '</div>'+
  '<p class="foot">더마릭은 올리브영 가격을 하루 두 번 관측해 기록합니다. 표시 할인율이 아니라 실제로 관측된 가격만 씁니다. '+
    '<a href="../">LAB의 다른 실험 보기</a></p>';

  $("#share").onclick=async function(){
    const url=location.origin+location.pathname+"#g="+PICK.gno+"&p="+mine;
    const msg=(j.name||"")+" "+won(mine)+" — "+h[0]+"\n"+url;
    try{ await navigator.clipboard.writeText(msg); this.textContent="복사됐어요"; }
    catch(e){ this.textContent="주소창의 링크를 복사해 주세요"; }
  };
  out.scrollIntoView({behavior:"smooth",block:"start"});
}

/* ───────── 초기화 ───────── */
wireSearch();
$("#p").oninput=()=>{ $("#pe").classList.add("hide"); sync(); };
$("#p").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); if(!$("#ok").disabled) render(); } };
$("#ok").onclick=render;

(async function(){
  const m=/^#g=([A-Z0-9]+)(?:&p=(\d+))?/.exec(location.hash||"");
  if(!m) return;
  await setProduct(m[1]);
  if(m[2] && PICK){ $("#p").value=m[2]; sync(); render(); }
})();
</script>
</body>
</html>
